app-id: org.fptn.VPN
runtime: org.freedesktop.Platform
runtime-version: "23.08"
sdk: org.freedesktop.Sdk
command: fptn-client-cli

finish-args:
  - --share=network
  - --device=all

modules:
  - name: fptn-client-cli
    buildsystem: simple
    build-commands:
      - install -Dm755 fptn-client-cli /app/bin/fptn-client-cli
    sources:
      - type: dir
        path: build/src/fptn-client
