name: Build Flatpak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  flatpak:
    name: "Flatpak Build"
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y python3-pip cmake ninja-build gcc g++ git

      - name: Install Conan and Configure Profile
        run: |
          pip3 install "conan==2.24.0"
          conan profile detect --force

      - name: Conan Install Dependencies
        run: |
          conan install . --output-folder=build --build=missing -s compiler.cppstd=17 -o with_gui_client=False --settings build_type=Release

      - name: Build with CMake
        run: |
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Package as Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: fptn-flatpak.yml
          bundle: fptn.flatpak
          upload-artifact: true
